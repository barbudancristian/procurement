name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: Web interface (tests and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  desktop:
    name: Windows app and installer
    needs: ui
    runs-on: windows-latest
    env:
      VERSION: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: desktop/SourcingHub.Desktop/wwwroot
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish desktop app
        run: dotnet publish desktop/SourcingHub.Desktop/SourcingHub.Desktop.csproj -c Release -o out/app -p:Version=${{ env.VERSION }}
      - name: Build MSI
        shell: pwsh
        run: dotnet build desktop/Installer/SourcingHub.Installer.wixproj -c Release -o out/msi -p:Version=${{ env.VERSION }} "-p:AppDir=$((Resolve-Path out/app).Path)\"
      - uses: actions/upload-artifact@v4
        with:
          name: SourcingHub-${{ env.VERSION }}-installer
          path: out/msi/*.msi
          retention-days: 30
